name: Download Dukascopy Ticks

on:
  # ── Manual trigger with inputs ──
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      from_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2024-01-01"
      to_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2024-01-02"
      point_value:
        description: "Point value (100000 for 5-dec pairs)"
        required: true
        default: "100000"

  # ── Optional: run on push to main ──
  # push:
  #   branches: [ main ]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # 6 h max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build fat JAR
        run: mvn -B clean package -DskipTests

      - name: Download tick data
        run: |
          java -jar target/tick-exporter-1.0.0.jar \
            "${{ github.event.inputs.instrument || 'EURUSD' }}" \
            "${{ github.event.inputs.from_date  || '2024-01-01' }}" \
            "${{ github.event.inputs.to_date    || '2024-01-02' }}" \
            "output/ticks.csv" \
            "${{ github.event.inputs.point_value || '100000' }}"

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: tick-data-${{ github.event.inputs.instrument || 'EURUSD' }}
          path: output/ticks.csv
          retention-days: 30
      - name: Download tick data
        run: |
          mkdir -p output
          java -jar target/tick-exporter-1.0.0.jar \
            "${{ github.event.inputs.instrument || 'EURUSD' }}" \
            "${{ github.event.inputs.from_date  || '2024-01-01' }}" \
            "${{ github.event.inputs.to_date    || '2024-01-02' }}" \
            "output/ticks.csv" \
            "${{ github.event.inputs.point_value || '100000' }}"          
